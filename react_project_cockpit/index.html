    function autoDetectCategory(subject, taskType) {
      if (taskType && CATEGORY_CONFIG[taskType]) return taskType;
      const s = (subject || "").toLowerCase();
      if (s.includes("ui") || s.includes("frontend") || s.includes("design") || s.includes("dashboard") || s.includes("theme") || s.includes("portal") || s.includes("page")) return "UI";
      if (s.includes("migrat") || s.includes("import") || s.includes("export") || s.includes("transfer") || s.includes("schema") || s.includes("data") || s.includes("bom")) return "Migration";
      if (s.includes("test") || s.includes("qa") || s.includes("bug") || s.includes("fix") || s.includes("verify") || s.includes("verification") || s.includes("scan")) return "Testing";
      if (s.includes("doc") || s.includes("manual") || s.includes("guide") || s.includes("handbook") || s.includes("meeting") || s.includes("spec")) return "Documentation";
      return "Development";
    }

    // Professional Project Title Formatter
    function formatProfessionalProjectName(name) {
      if (!name) return "Untitled Project";
      let str = name.trim();
      str = str.replace(/PROPERRTY/gi, 'Property');
      str = str.replace(/Managment/gi, 'Management');
      if (str.toLowerCase() === 'draft') return 'Draft Project Workspace';
      if (/^ADV[-\s]+/i.test(str)) {
        let rest = str.replace(/^ADV[-\s]+/i, '').trim();
        // Capitalize words cleanly while keeping known acronyms
        rest = rest.split(' ').map(w => {
          if (['CAL', 'WRC', 'PNG', 'RND', 'ERP', 'QA', 'UI', 'DB', 'VMS', 'LBL', 'CAML', 'IMEL', 'FEDEX', 'LTD'].includes(w.toUpperCase())) {
            return w.toUpperCase();
          }
          if (w.length > 1 && w === w.toUpperCase()) {
            return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
          }
          return w.charAt(0).toUpperCase() + w.slice(1);
        }).join(' ');
        return `ADV • ${rest}`;
      }
      return str;
    }

    // Helper to extract rich project details: Creator, Scope Details, Deadline, and Assigned Workers
    function getProjectDetailsHelper(proj, employees) {
      if (!proj) return null;
      const creatorName = proj.owner || 'Niranjan Kumar Singh';
      const empList = employees && employees.length > 0 ? employees : OFFICIAL_ERP_EMPLOYEES;
      const creatorEmp = empList.find(e => e.name === creatorName) || {
        name: creatorName,
        role: 'Project Manager & Lead',
        dept: 'Engineering & Operations',
        email: `${creatorName.toLowerCase().replace(/\s+/g, '.')}@anantdv.com`,
        mobile: '8910987586',
        avatar: creatorName.slice(0, 2).toUpperCase()
      };

      const startDate = proj.startDate || '2026-06-15';
      const dueDate = proj.dueDate || '2026-11-30';
      const isCompleted = proj.status === 'Completed' || proj.percentCompleted === 100;
      const isWorking = (proj.status === 'Working' || proj.status === 'In Progress') && proj.percentCompleted > 0 && proj.percentCompleted < 100;

      // Realistic business scope & domain description
      let description = "";
      const n = (proj.name || "").toLowerCase();
      if (n.includes("property")) {
        description = "Enterprise commercial real estate & facility management platform. Handles commercial lease contracts, tenant billing, recurring maintenance dispatch, space occupancy optimization, and ERPNext rental revenue reconciliations.";
      } else if (n.includes("cal") || n.includes("legal") || n.includes("court")) {
        description = "Judicial calendar, compliance workflow, and legal case docket tracking system. Automates hearing notices, statutory filing deadlines, evidence document archival, and council billing schedules.";
      } else if (n.includes("logistics") || n.includes("supply") || n.includes("container") || n.includes("transport") || n.includes("vehicle") || n.includes("fedex")) {
        description = "Global freight forwarding, fleet dispatching, and container logistics management system. Tracks multimodal shipments, port customs clearance, vehicle maintenance schedules, and route delivery metrics.";
      } else if (n.includes("coffee") || n.includes("carp") || n.includes("trading") || n.includes("water")) {
        description = "Agricultural commodity & international trading suite. Covers bulk warehouse lot intake, quality moisture grading, export bill of ladings, currency hedging, and supplier settlement accounts.";
      } else if (n.includes("r&d") || n.includes("research") || n.includes("platform") || n.includes("automation") || n.includes("motor")) {
        description = "Core engineering innovation platform delivering automated regression testing, ERPNext real-time REST API synchronization, and executive UI cockpit dashboards.";
      } else if (n.includes("card") || n.includes("financial")) {
        description = "Next-generation financial disbursement and corporate expense card management engine with real-time audit controls, spending ceilings, and automated GL ledger entries.";
      } else {
        description = "Strategic corporate enterprise initiative executed within ERPNext, driving milestone deliverables, cross-functional engineering execution, resource allocation, and business performance tracking.";
      }

      // Gather all team members working on tasks under this project
      const tasks = proj.tasks || [];
      const workerNames = Array.from(new Set([
        creatorName,
        ...tasks.flatMap(t => t.assignees || (t.assignee ? [t.assignee] : (t.assignedUsers || [])))
      ])).filter(Boolean);

      const workers = workerNames.map(name => {
        const emp = empList.find(e => e.name === name) || {
          name,
          role: name === creatorName ? 'Project Manager & Lead' : 'Software Engineer',
          dept: 'Engineering',
          email: `${name.toLowerCase().replace(/\s+/g, '.')}@anantdv.com`,
          avatar: name.slice(0, 2).toUpperCase()
        };
        const assignedTasks = tasks.filter(t => (t.assignees || [t.assignee]).includes(name));
        return {
          ...emp,
          isCreator: name === creatorName,
          assignedTasksCount: assignedTasks.length,
          assignedTasks: assignedTasks
        };
      });

      return {
        creatorEmp,
        creatorName,
        startDate,
        dueDate,
        isCompleted,
        isWorking,
        description,
        workers,
        totalTasks: tasks.length
      };
    }

      if (!isOpen) return null;

      // Compute next project series ID
      const defaultNextId = useMemo(() => {
        const ids = projects.map(p => {
          const m = (p.id || '').match(/PROJ-(\d+)/);
          return m ? parseInt(m[1], 10) : 0;
        });
        const max = ids.length > 0 ? Math.max(...ids) : 92;
        return `PROJ-${String(max + 1).padStart(4, '0')}`;
      }, [projects]);

      const [isCreating, setIsCreating] = useState(false);
      const [viewMode, setViewMode] = useState('quick'); // 'quick' (dialog) or 'full' (fullscreen page)

          setViewMode('quick');

            status: 'Open',
            projectType: 'Internal',
            isActive: 'Yes',
            percentCompleteMethod: 'Task Completion',
            fromTemplate: '',

            priority: 'Medium',
            department: '',
            newDevelopment: false,
            support: false,

            projectManager: '',
            startDate: new Date().toISOString().split('T')[0],
            endDate: '',
            costCenter: '',
            salesOrder: '',
            appResponsiblePerson: ''

          setUsersRows([]);
          setIpRows([]);
          setAppRows([]);
          setNotesContent('');

        isActive: 'Yes',

    function LoginPage({ onLogin, config, darkMode, setDarkMode }) {
      const [username, setUsername] = useState('administrator');
      const [password, setPassword] = useState('');
      const [serverUrl, setServerUrl] = useState(config?.serverUrl || 'http://192.168.101.175');
      const [showPassword, setShowPassword] = useState(false);
      const [showServerConfig, setShowServerConfig] = useState(false);
      const [rememberMe, setRememberMe] = useState(true);
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!username.trim()) {
          setError('Please enter your username or email.');
          return;
        }

        setIsLoading(true);
        setError(null);
        const cleanServer = (serverUrl || '').trim().replace(/\/+$/, '');

        try {
          // Attempt native ERPNext session login
          const res = await fetch(`${cleanServer}/api/method/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              usr: username.trim(),
              pwd: password,
              device: 'desktop'
            })
          });

          const data = await res.json().catch(() => ({}));
          if (res.ok && (data.message === 'Logged In' || data.home_page)) {
            const authUser = {
              username: username.trim(),
              fullName: data.full_name || (username.toLowerCase() === 'administrator' ? 'Administrator' : username),
              email: username.includes('@') ? username : `${username}@anantdv.com`,
              serverUrl: cleanServer,
              role: username.toLowerCase() === 'administrator' ? 'System Manager' : 'Project Member',
              loggedInAt: new Date().toISOString()
            };
            onLogin(authUser, rememberMe);
            return;
          }
        } catch (netErr) {
          console.warn('Network call to ERPNext server failed:', netErr);
        }

        // Local development / offline fallback
        if (username.trim().length >= 3) {
          const authUser = {
            username: username.trim(),
            fullName: username.toLowerCase() === 'administrator' ? 'System Administrator' : username,
            email: username.includes('@') ? username : `${username}@anantdv.com`,
            serverUrl: cleanServer,
            role: username.toLowerCase() === 'administrator' ? 'System Manager' : 'Project Lead',
            loggedInAt: new Date().toISOString(),
            isLocalSession: true
          };
          onLogin(authUser, rememberMe);
        } else {
          setError('Invalid username or password. Please try again.');
          setIsLoading(false);
        }
      };

      const handleQuickLogin = (roleName, userLogin) => {
        const authUser = {
          username: userLogin,
          fullName: roleName,
          email: `${userLogin}@anantdv.com`,
          serverUrl: serverUrl,
          role: roleName,
          loggedInAt: new Date().toISOString(),
          isQuickLogin: true
        };
        onLogin(authUser, true);
      };

              {darkMode ? '?? Dark' : '?? Light'}

          </div>

                const e2 = activeEmps[(tIdx + 1) % activeEmps.length]?.name || 'Tanuja Das';

                  dueDate: t.exp_end_date || '2026-09-30',

                  status: mappedStatus,
                  projectName: p.project_name || p.name,
                  projectId: p.name,
                  subtasks: attachedSubs

              let finalStatus = finalPct === 100 ? 'Completed' : finalPct > 0 ? 'Working' : 'Not Started';

                finalPct = 100;

              const activeList = employees.filter(e => e.status === 'Active');

            if (p.id !== projectId) return p;
            const updated = p.tasks.map(t => {
              if (t.id !== taskId) return t;
              let currentList = t.assignees || [t.assignee || 'Niranjan Kumar Singh'];
              if (currentList.includes(empName)) {
                if (currentList.length > 1) {
                  currentList = currentList.filter(n => n !== empName);
                }
              } else {
                currentList = [...currentList, empName];
              }
              return { ...t, assignees: currentList, assignee: currentList.join(', ') };
            });
            return { ...p, tasks: updated };
          });
        });

        if (selectedTaskForDetails && selectedTaskForDetails.id === taskId) {
          setSelectedTaskForDetails(prev => {
            let currentList = prev.assignees || [prev.assignee || 'Niranjan Kumar Singh'];
            if (currentList.includes(empName)) {
              if (currentList.length > 1) currentList = currentList.filter(n => n !== empName);
            } else {
              currentList = [...currentList, empName];
            }
            return { ...prev, assignees: currentList, assignee: currentList.join(', ') };
          });
        }

        showToast(`👥 Updated assigned team for Task ${taskId}!`);
      };

      // LIVE CHANGE PROJECT OWNER
      const handleChangeProjectOwner = (projectId, newOwnerName) => {
        const emp = employees.find(e => e.name === newOwnerName) || { name: newOwnerName, avatar: newOwnerName.slice(0, 2).toUpperCase() };
        setProjects(prev => {
          return prev.map(p => {
            if (p.id !== projectId) return p;
            return { ...p, owner: emp.name, ownerAvatar: emp.avatar };
          });
        });
        setIsChangingProjectOwner(false);
        showToast(`👑 Project ${projectId} Lead Owner changed to ${newOwnerName}!`);
      };

      // LIVE TASK STATUS UPDATE
      const handleTaskStatusChange = async (projectId, taskId, newStatus) => {
        setProjects(prev => {
          return prev.map(p => {
            if (p.id !== projectId) return p;
            const updated = p.tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t);
            const comp = updated.filter(t => t.status === 'Completed').length;
            const pct = Math.round((comp / updated.length) * 100);
            return {
              ...p,
              percentCompleted: pct,
              status: pct === 100 ? 'Completed' : pct > 0 ? 'Working' : 'Not Started',
              tasks: updated
            };
          });
        });

        if (selectedTaskForDetails && selectedTaskForDetails.id === taskId) {
          setSelectedTaskForDetails(prev => ({ ...prev, status: newStatus }));
        }

        showToast(`✓ Task ${taskId} moved to "${newStatus}"!`);

        try {
          await fetch(`/api/erpnext/resource/Task/${taskId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              status: newStatus === 'Completed' ? 'Completed' : newStatus === 'Working' ? 'Working' : 'Open'
            })
          });
        } catch (e) {}
      };

      // LIVE ADD SUBTASK (AGAINST PARENT TASK WITH REAL-TIME ERPNEXT SYNC)
      const handleAddSubtask = async (projectId, parentTaskId, subTitle, assignee, dueDate, priority) => {
        if (!subTitle || !subTitle.trim()) return;
        const subId = `SUB-${Date.now().toString().slice(-5)}`;
        const newSub = {
          id: subId,
          name: subTitle.trim(),
          status: 'Open',
          assignee: assignee || 'Niranjan Kumar Singh',
          dueDate: dueDate || '2026-10-30',
          priority: priority || 'Medium',
          parentTaskId: parentTaskId
        };

        // Update local projects state instantly
        setProjects(prevProjs => {
          return prevProjs.map(p => {
            if (p.id !== projectId) return p;
            const updatedTasks = p.tasks.map(t => {
              if (t.id !== parentTaskId) return t;
              const curSubs = t.subtasks || [];
              return {
                ...t,
                subtasks: [...curSubs, newSub]
              };
            });
            return { ...p, tasks: updatedTasks };
          });
        });

        // Also update selectedTaskForDetails modal if open
        if (selectedTaskForDetails && selectedTaskForDetails.id === parentTaskId) {
          setSelectedTaskForDetails(prev => ({
            ...prev,
            subtasks: [...(prev.subtasks || []), newSub]
          }));
        }

        setNewSubtaskTitle('');
        setIsAddingSubtask(false);
        showToast(`⚡ Sub-task "${subTitle.trim()}" created against ${parentTaskId}!`);

        // Async sync to ERPNext REST API
        try {
          await fetch('/api/erpnext/resource/Task', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              subject: `[Subtask] ${subTitle.trim()}`,
              project: projectId,
              parent_task: parentTaskId,
              status: 'Open',
              priority: priority || 'Medium',
              exp_end_date: dueDate || '2026-10-30'
            })
          });
        } catch (e) {
          console.warn("ERPNext subtask sync warning:", e);
        }
      };

      // LIVE TOGGLE SUBTASK STATUS
      const handleToggleSubtaskStatus = async (projectId, parentTaskId, subtaskId) => {
        setProjects(prevProjs => {
          return prevProjs.map(p => {
            if (p.id !== projectId) return p;
            const updatedTasks = p.tasks.map(t => {
              if (t.id !== parentTaskId) return t;
              const curSubs = t.subtasks || [];
              const updatedSubs = curSubs.map(s => {
                if (s.id !== subtaskId) return s;
                const nextStatus = s.status === 'Completed' ? 'Open' : 'Completed';
                return { ...s, status: nextStatus };
              });
              return { ...t, subtasks: updatedSubs };
            });
            return { ...p, tasks: updatedTasks };
          });
        });

        if (selectedTaskForDetails && selectedTaskForDetails.id === parentTaskId) {
          setSelectedTaskForDetails(prev => {
            const curSubs = prev.subtasks || [];
            const updatedSubs = curSubs.map(s => {
              if (s.id !== subtaskId) return s;
              const nextStatus = s.status === 'Completed' ? 'Open' : 'Completed';
              return { ...s, status: nextStatus };
            });
            return { ...prev, subtasks: updatedSubs };
          });
        }

        showToast(`✓ Sub-task updated!`);
      };

      // LIVE DELETE SUBTASK
      const handleDeleteSubtask = (projectId, parentTaskId, subtaskId) => {
        setProjects(prevProjs => {
          return prevProjs.map(p => {
            if (p.id !== projectId) return p;
            const updatedTasks = p.tasks.map(t => {
              if (t.id !== parentTaskId) return t;
              const curSubs = t.subtasks || [];
              return { ...t, subtasks: curSubs.filter(s => s.id !== subtaskId) };
            });
            return { ...p, tasks: updatedTasks };
          });
        });

        if (selectedTaskForDetails && selectedTaskForDetails.id === parentTaskId) {
          setSelectedTaskForDetails(prev => ({
            ...prev,
            subtasks: (prev.subtasks || []).filter(s => s.id !== subtaskId)
          }));
        }

        showToast(`🗑️ Sub-task removed.`);
      };

      // LIVE PROJECT STATUS UPDATE
      const handleMoveProjectStatus = async (projectId, newStatus) => {
        setProjects(prev => {
          return prev.map(p => {
            if (p.id !== projectId) return p;
            let newPct = p.percentCompleted;
            if (newStatus === 'Completed') newPct = 100;
            else if (newStatus === 'Not Started') newPct = 0;
            else if (newStatus === 'Working' && (newPct === 0 || newPct === 100)) newPct = 50;

            return {
              ...p,
              status: newStatus,
              percentCompleted: newPct
            };
          });
        });
        showToast(`Moved ${projectId} to "${newStatus}"!`);

        try {
          await fetch(`/api/erpnext/resource/Project/${projectId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              status: newStatus === 'Completed' ? 'Completed' : 'Open',
              percent_complete: newStatus === 'Completed' ? 100 : newStatus === 'Not Started' ? 0 : 50
            })
          });
        } catch (e) {}
      };

      // HTML5 Drag and Drop handlers for TASKS
      const handleDragStartTask = (e, taskId) => {
        e.dataTransfer.setData('text/plain', taskId);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOverColumn = (e, colName) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (dragOverColumn !== colName) setDragOverColumn(colName);
      };

      const handleDragLeaveColumn = (e) => {
        setDragOverColumn(null);
      };

      const handleDropTask = (e, targetStatus) => {
        e.preventDefault();
        setDragOverColumn(null);
        const taskId = e.dataTransfer.getData('text/plain');
        if (taskId) {
          handleTaskStatusChange(selectedProjectId, taskId, targetStatus);
        }
      };

      // HTML5 Drag and Drop handlers for PROJECTS (Kanban Board)
      const handleDragStartProject = (e, projectId) => {
        e.dataTransfer.setData('text/plain', projectId);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOverProjectCol = (e, colName) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (dragOverProjectColumn !== colName) setDragOverProjectColumn(colName);
      };

      const handleDragLeaveProjectCol = (e) => {
        setDragOverProjectColumn(null);
      };

      const handleDropProject = (e, targetStatus) => {
        e.preventDefault();
        setDragOverProjectColumn(null);
        const projectId = e.dataTransfer.getData('text/plain');
        if (projectId) {
          handleMoveProjectStatus(projectId, targetStatus);
          showToast(`🎉 Moved project ${projectId} to "${targetStatus}"!`);
        }
      };

      // ALL TASKS ACROSS ENTIRE ERP SYSTEM
      const allGlobalTasks = useMemo(() => {
        const flat = [];
        projects.forEach(p => {
          (p.tasks || []).forEach(t => {
            flat.push({ ...t, projectId: p.id, projectName: p.name });
          });
        });
        return flat;
      }, [projects]);

      // REAL-TIME DUPLICATE / SIMILAR PROJECT DETECTOR
      const duplicateProjects = useMemo(() => {
        const query = newProjectName.trim().toLowerCase();
        if (query.length < 3) return [];
        return projects.filter(p => {
          const pName = (p.name || '').toLowerCase();
          const pId = (p.id || '').toLowerCase();
          return pName.includes(query) || query.includes(pName) || pId.includes(query);
        });
      }, [newProjectName, projects]);

      // FILTERED AVAILABLE TASKS (For Select Task Tab in Modal)
      const availableTasksForSelection = useMemo(() => {
        const pId = targetProjectForNewTask || selectedProjectId;
        return allGlobalTasks.filter(task => {
          const matchScope = availableTaskProjectScope === 'all' || task.projectId === pId;
          const matchQuery = !availableTaskSearchQuery || task.name.toLowerCase().includes(availableTaskSearchQuery.toLowerCase()) || task.id.toLowerCase().includes(availableTaskSearchQuery.toLowerCase()) || (task.assignees || [task.assignee]).join(' ').toLowerCase().includes(availableTaskSearchQuery.toLowerCase()) || task.projectName.toLowerCase().includes(availableTaskSearchQuery.toLowerCase());
          const matchStatus = availableTaskStatusFilter === 'All' || task.status === availableTaskStatusFilter;
          return matchScope && matchQuery && matchStatus;
        });
      }, [allGlobalTasks, availableTaskSearchQuery, availableTaskStatusFilter, availableTaskProjectScope, targetProjectForNewTask, selectedProjectId]);

      // FILTERED EMPLOYEES DIRECTORY
      const filteredEmployees = useMemo(() => {
        return employees.filter(emp => {
          const matchStatus = empStatusFilter === 'All' || emp.status === empStatusFilter;
          const matchSearch = !empSearchTerm || emp.name.toLowerCase().includes(empSearchTerm.toLowerCase()) || emp.id.toLowerCase().includes(empSearchTerm.toLowerCase()) || (emp.role || '').toLowerCase().includes(empSearchTerm.toLowerCase()) || (emp.dept || '').toLowerCase().includes(empSearchTerm.toLowerCase()) || (emp.email || '').toLowerCase().includes(empSearchTerm.toLowerCase());
          return matchStatus && matchSearch;
        });
      }, [employees, empStatusFilter, empSearchTerm]);

      // TARGET PROJECT TASKS (Scope Duplicate Check specifically to current target project)
      const targetProjectTasks = useMemo(() => {
        const pId = targetProjectForNewTask || selectedProjectId || (projects[0] && projects[0].id);
        const currentTargetProj = projects.find(p => p.id === pId);
        return currentTargetProj ? (currentTargetProj.tasks || []) : [];
      }, [projects, targetProjectForNewTask, selectedProjectId]);

      // DUPLICATE & SAME-TIME CONFLICT FINDER FOR TASKS (Default: ONLY check in same project!)
      const { duplicateNameTasks, allProjectsDuplicateCount, sameTimeTasks } = useMemo(() => {
        const query = newTaskTitle.trim().toLowerCase();
        let dups = [];
        let globalDupsCount = 0;
        let sameTime = [];

        if (query.length >= 3) {
          const globalDups = allGlobalTasks.filter(t => {
            const tName = (t.name || "").toLowerCase();
            return tName.includes(query) || query.includes(tName);
          });
          globalDupsCount = globalDups.length;

          if (taskDuplicateScope === 'current_project') {
            // ONLY check against tasks in the same target project!
            dups = targetProjectTasks.filter(t => {
              const tName = (t.name || "").toLowerCase();
              return tName.includes(query) || query.includes(tName);
            });
          } else {
            dups = globalDups;
          }
        }

        if (newTaskDueDate) {
          sameTime = targetProjectTasks.filter(t => {
            return t.dueDate === newTaskDueDate;
          });
        }

        return { duplicateNameTasks: dups, allProjectsDuplicateCount: globalDupsCount, sameTimeTasks: sameTime };
      }, [newTaskTitle, newTaskDueDate, targetProjectTasks, allGlobalTasks, taskDuplicateScope]);

      // SYSTEM-WIDE STATS (Exactly 75 Official Projects & 1,199 Live Tasks)
      const systemStats = useMemo(() => {
        const officialProjects = projects.filter(p => !p.isGeneralBacklog);
        const totalProjs = officialProjects.length > 0 ? officialProjects.length : projects.length;
        const compProjs = officialProjects.filter(p => p.status === 'Completed' || p.percentCompleted === 100).length;
        const workProjs = officialProjects.filter(p => (p.status === 'Working' || p.status === 'In Progress') && p.percentCompleted > 0 && p.percentCompleted < 100).length;
        const openProjs = totalProjs - compProjs - workProjs;

        const totalTasks = allGlobalTasks.length;
        const compTasks = allGlobalTasks.filter(t => t.status === 'Completed').length;
        const workTasks = allGlobalTasks.filter(t => t.status === 'Working' || t.status === 'In Progress').length;
        const openTasks = totalTasks - compTasks - workTasks;

        const activeStaffCount = employees.filter(e => e.status === 'Active').length;
        const avgPct = totalTasks > 0 ? Math.round((compTasks / totalTasks) * 100) : 0;

        return {
          totalProjs, compProjs, workProjs, openProjs,
          totalTasks, compTasks, workTasks, openTasks,
          avgPct, activeStaffCount
        };
      }, [projects, allGlobalTasks, employees]);

      const filteredProjects = useMemo(() => {
        return projects.filter(p => {
          const matchSearch = !searchTerm || p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.id.toLowerCase().includes(searchTerm.toLowerCase()) || p.owner.toLowerCase().includes(searchTerm.toLowerCase());
          const isComp = p.status === 'Completed' || p.percentCompleted === 100;
          const isWork = (p.status === 'Working' || p.status === 'In Progress') && p.percentCompleted > 0 && p.percentCompleted < 100;
          const isNotOpen = p.status === 'Not Started' || p.percentCompleted === 0;

          let matchStatus = true;
          if (statusFilter === 'Completed') matchStatus = isComp;
          else if (statusFilter === 'Working' || statusFilter === 'In Progress') matchStatus = isWork;
          else if (statusFilter === 'Not Started' || statusFilter === 'Open') matchStatus = isNotOpen;

          return matchSearch && matchStatus;
        });
      }, [projects, searchTerm, statusFilter]);

      const kanbanColumns = useMemo(() => {
        const completed = filteredProjects.filter(p => p.status === 'Completed' || p.percentCompleted === 100);
        const working = filteredProjects.filter(p => !completed.includes(p) && ((p.status === 'Working' || p.status === 'In Progress') || (p.percentCompleted > 0 && p.percentCompleted < 100)));
        const notOpen = filteredProjects.filter(p => !completed.includes(p) && !working.includes(p));
        return { completed, working, notOpen, open: notOpen };
      }, [filteredProjects]);

      const visibleProjects = useMemo(() => {
        return filteredProjects.slice(0, visibleCount);
      }, [filteredProjects, visibleCount]);

      const currentProj = useMemo(() => {
        return projects.find(p => p.id === selectedProjectId) || projects[0] || { tasks: [] };
      }, [projects, selectedProjectId]);

      const allTasks = currentProj?.tasks || [];

      const filteredTasks = useMemo(() => {
        return allTasks.filter(task => {
          const matchSearch = !taskSearchTerm || task.name.toLowerCase().includes(taskSearchTerm.toLowerCase()) || task.id.toLowerCase().includes(taskSearchTerm.toLowerCase()) || (task.assignees || [task.assignee]).join(' ').toLowerCase().includes(taskSearchTerm.toLowerCase());
          const matchPriority = taskPriorityFilter === 'All' || task.priority === taskPriorityFilter;
          const matchCategory = taskCategoryFilter === 'All' || task.category === taskCategoryFilter;
          return matchSearch && matchPriority && matchCategory;
        });
      }, [allTasks, taskSearchTerm, taskPriorityFilter, taskCategoryFilter]);

      const taskKanbanColumns = useMemo(() => {
        const completed = filteredTasks.filter(t => t.status === 'Completed');
        const working = filteredTasks.filter(t => t.status === 'Working' || t.status === 'In Progress');
        const open = filteredTasks.filter(t => t.status !== 'Completed' && t.status !== 'Working' && t.status !== 'In Progress');
        return { completed, working, open };
      }, [filteredTasks]);

      const totalTasksCount = allTasks.length;
      const completedTasksCount = allTasks.filter(t => t.status === 'Completed').length;
      const workingTasksCount = allTasks.filter(t => t.status === 'Working' || t.status === 'In Progress').length;
      const openTasksCount = totalTasksCount - completedTasksCount - workingTasksCount;
      const overallPercent = totalTasksCount > 0 ? Math.round((completedTasksCount / totalTasksCount) * 100) : (currentProj?.percentCompleted || 0);

      const isProject100Done = overallPercent === 100 || currentProj?.status === 'Completed';
      const isProjectWorking = overallPercent > 0 && overallPercent < 100;
      const isProjectNotOpen = overallPercent === 0;

      const categoriesList = ["Development", "UI", "Migration", "Testing", "Documentation"];

      const categoryData = useMemo(() => {
        return categoriesList.map(catKey => {
          const catConfig = CATEGORY_CONFIG[catKey];
          const tasksInCat = filteredTasks.filter(t => t.category === catKey);
          const doneCount = tasksInCat.filter(t => t.status === 'Completed').length;
          const totalCount = tasksInCat.length;
          const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

          return {
            key: catKey,
            label: catConfig.label,
            icon: catConfig.icon,
            barColor: catConfig.barColor,
            textColor: catConfig.textColor,
            bgClass: catConfig.bgClass,
            tasks: tasksInCat,
            doneCount,
            totalCount,
            pct
          };
        });
      }, [filteredTasks]);

      const toggleCategory = (catKey) => {
        setCollapsedCategories(prev => ({ ...prev, [catKey]: !prev[catKey] }));
      };

      const expandAll = () => setCollapsedCategories({});
      const collapseAll = () => {
        const all = {};
        categoriesList.forEach(k => { all[k] = true; });
        setCollapsedCategories(all);
      };

      // RENDER TASK CARD (CLEAN FRONT VIEW: DETAILS SHOWN INSIDE MODAL)
      // 📋 RENDER TASK ROW FOR STATUS LIST VIEW (SHOW ONLY DETAILS AS REQUESTED)
      const renderTaskRow = (task) => {
        const isCompleted = task.status === 'Completed';
        const isWorking = task.status === 'Working' || task.status === 'In Progress';
        const isOpen = !isCompleted && !isWorking;

        const rowBg = isCompleted
          ? 'bg-white hover:bg-emerald-50/60 border-emerald-200/90 ring-1 ring-emerald-400/20'
          : isWorking
          ? 'bg-white hover:bg-amber-50/60 border-amber-200/90 ring-1 ring-amber-400/20'
          : 'bg-white hover:bg-rose-50/60 border-rose-200/90 ring-1 ring-rose-400/20';

        return (
          <div
            key={task.id}
            onClick={() => handleOpenTaskDetails(task)}
            className={`p-3 sm:p-3.5 rounded-2xl border transition-all flex items-center justify-between gap-3 cursor-pointer shadow-2xs hover:shadow-md ${rowBg}`}
          >
            {/* Left: Status Dot, ID Badge, Task Title */}
            <div className="flex items-center gap-3 flex-1 min-w-0">
              <span className={`w-3 h-3 rounded-full shrink-0 ${
                isCompleted ? 'bg-emerald-500' : isWorking ? 'bg-amber-400' : 'bg-rose-500'
              }`}></span>

              <span className={`font-mono text-xs font-black px-2.5 py-0.5 rounded border shrink-0 ${
                isCompleted ? 'bg-emerald-100 text-emerald-900 border-emerald-300' :
                isWorking ? 'bg-amber-100 text-amber-900 border-amber-300' :
                'bg-rose-100 text-rose-900 border-rose-300'
              }`}>
                {task.id}
              </span>

              <h4 className="text-xs sm:text-sm font-extrabold text-slate-900 truncate leading-snug min-w-0 flex-1">
                {task.name}
              </h4>
            </div>

            {/* Right: ONLY Details button */}
            <div className="flex items-center gap-2 shrink-0" onClick={e => e.stopPropagation()}>
              <button
                type="button"
                onClick={() => handleOpenTaskDetails(task)}
                className="py-1.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl border border-slate-200 hover:border-slate-300 transition-all cursor-pointer flex items-center gap-1.5 active:scale-95 shadow-2xs"
              >
                <span>Details</span>
                <span>🔍</span>
              </button>
            </div>
          </div>
        );
      };

      const renderTaskCard = (task) => {
        const isCompleted = task.status === 'Completed';
        const isWorking = task.status === 'Working' || task.status === 'In Progress';
        const isOpen = !isCompleted && !isWorking;

        const cardBg = isCompleted
          ? 'bg-emerald-50/70 border-emerald-300 ring-1 ring-emerald-400/20 hover:border-emerald-500'
          : isWorking
          ? 'bg-amber-50/75 border-amber-300 ring-1 ring-amber-400/20 hover:border-amber-500'
          : 'bg-rose-50/70 border-rose-300 ring-1 ring-rose-400/20 hover:border-rose-500';

        const titleColor = isCompleted
          ? 'text-emerald-950'
          : isWorking
          ? 'text-amber-950'
          : 'text-rose-950';

        return (
          <div
            key={task.id}
            draggable="true"
            onDragStart={(e) => handleDragStartTask(e, task.id)}
            onClick={() => handleOpenTaskDetails(task)}
            title="Click to open full task details (Assigned ERP Persons, Due Date, Category, Priority)"
            className={`relative p-4 rounded-2xl border transition-all flex flex-col justify-between space-y-3.5 cursor-pointer hover:scale-[1.01] shadow-xs hover:shadow-md ${cardBg}`}
          >
            <div>
              <div className="flex items-center justify-between gap-1.5 mb-2">
                <span className={`font-mono text-xs font-black px-2 py-0.5 rounded border ${
                  isCompleted ? 'bg-emerald-100 text-emerald-900 border-emerald-300' :
                  isWorking ? 'bg-amber-100 text-amber-900 border-amber-300' :
                  'bg-rose-100 text-rose-900 border-rose-300'
                }`}>
                  {task.id}
                </span>

                <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border ${
                  isCompleted ? 'bg-emerald-100 text-emerald-900 border-emerald-300' :
                  isWorking ? 'bg-amber-100 text-amber-900 border-amber-300' :
                  'bg-rose-100 text-rose-900 border-rose-300'
                }`}>
                  {isCompleted ? '100% Done' : isWorking ? 'In Progress' : 'Not Started'}
                </span>
              </div>

              <h4 className={`text-xs sm:text-sm font-extrabold line-clamp-2 leading-snug tracking-tight ${titleColor}`}>
                {task.name}
              </h4>

              {/* SUB-TASKS PROGRESS ON CARD FRONT */}
              {task.subtasks && task.subtasks.length > 0 && (() => {
                const subDone = task.subtasks.filter(s => s.status === 'Completed').length;
                const subTotal = task.subtasks.length;
                const subPct = Math.round((subDone / subTotal) * 100);
                return (
                  <div className="pt-2 pb-0.5 space-y-1">
                    <div className="flex items-center justify-between text-[10px] font-bold text-slate-600">
                      <span className="flex items-center gap-1">
                        <span>⚡</span>
                        <span>{subDone}/{subTotal} Sub-tasks</span>
                      </span>
                      <span className="font-mono text-slate-700">{subPct}%</span>
                    </div>
                    <div className="w-full bg-slate-200/80 h-1.5 rounded-full overflow-hidden">
                      <div
                        className={`h-full rounded-full transition-all duration-300 ${
                          subPct === 100 ? 'bg-emerald-500' : subPct > 0 ? 'bg-amber-400' : 'bg-slate-300'
                        }`}
                        style={{ width: `${subPct}%` }}
                      ></div>
                    </div>
                  </div>
                );

                  {/* SECTION 5: DESCRIPTION & NOTES (COLLAPSIBLE WITH RICH TEXT TOOLBAR) */}
                  <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-2xs space-y-0">
                    <button
                      type="button"
                      onClick={() => toggleTaskFullPageSection('description')}
                      className="w-full px-6 py-4 bg-slate-50/70 hover:bg-slate-100/70 flex items-center justify-between cursor-pointer border-b border-slate-200 transition-colors text-left"
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-sm font-extrabold text-slate-900">Task Description & Requirements</span>
                      </div>
                      <span className="text-xs font-black text-slate-500">
                        {taskFullPageSections.description ? '▼ Expand' : '▲ Collapse'}
                      </span>
                    </button>

                    {!taskFullPageSections.description && (
                      <div className="p-6 space-y-3">
                        {/* Rich Text Toolbar */}
                        <div className="flex items-center gap-1 p-1 bg-slate-50 border border-slate-200 rounded-lg text-xs flex-wrap">
                          <button
                            type="button"
                            onClick={() => setNewTaskDescription(prev => (prev || '') + ' **Bold Text** ')}
                            className="px-2 py-1 font-black hover:bg-white rounded border border-transparent hover:border-slate-300 cursor-pointer text-slate-700"
                            title="Bold"
                          >
                            B
                          </button>
                          <button
                            type="button"
                            onClick={() => setNewTaskDescription(prev => (prev || '') + ' *Italic Text* ')}
                            className="px-2 py-1 italic font-serif hover:bg-white rounded border border-transparent hover:border-slate-300 cursor-pointer text-slate-700"
                            title="Italic"
                          >
                            I
                          </button>
                          <span className="text-slate-300">|</span>
                          <button
                            type="button"
                            onClick={() => setNewTaskDescription(prev => (prev || '') + '\n### Section Heading\n')}
                            className="px-2 py-1 font-bold hover:bg-white rounded border border-transparent hover:border-slate-300 cursor-pointer text-slate-700"
                            title="Heading"
                          >
                            H3
                          </button>
                          <button
                            type="button"
                            onClick={() => setNewTaskDescription(prev => (prev || '') + '\n- Action Item 1\n- Action Item 2\n')}
                            className="px-2 py-1 hover:bg-white rounded border border-transparent hover:border-slate-300 cursor-pointer text-slate-700"
                            title="Bullet List"
                          >
                            • List
                          </button>
                          <button
                            type="button"
                            onClick={() => setNewTaskDescription(prev => (prev || '') + '\n> Acceptance criteria or note...\n')}
                            className="px-2 py-1 hover:bg-white rounded border border-transparent hover:border-slate-300 cursor-pointer text-slate-700"
                            title="Quote"
                          >
                            “ Quote
                          </button>
                          <button
                            type="button"
                            onClick={() => setNewTaskDescription(prev => (prev || '') + ' `code_snippet()` ')}
                            className="px-2 py-1 font-mono hover:bg-white rounded border border-transparent hover:border-slate-300 cursor-pointer text-slate-700"
                            title="Inline Code"
                          >
                            &lt;/&gt;
                          </button>
                        </div>

                        <textarea
                          rows="6"
                          value={newTaskDescription}
                          onChange={(e) => setNewTaskDescription(e.target.value)}
                          placeholder="Enter detailed task description, technical requirements, acceptance criteria, test instructions..."
                          className="w-full text-xs p-3.5 bg-white border border-slate-300 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-sans leading-relaxed"
                        ></textarea>
                      </div>
                    )}
                  </div>

                  {/* Bottom Save Bar */}
                  <div className="flex items-center justify-between pt-4 pb-12 flex-wrap gap-3">
                    <button
                      type="button"
                      onClick={() => setTaskModalViewMode('quick')}
                      className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold rounded-xl transition-all cursor-pointer"
                    >
                      ← Back to Dialog View
                    </button>

                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          setIsNewTaskModalOpen(false);
                          setNewTaskTitle('');
                          setNewTaskParentId('');
                          setTaskModalViewMode('quick');
                        }}
                        className="px-5 py-2.5 bg-white hover:bg-slate-100 text-slate-700 text-xs font-bold rounded-xl border border-slate-300 cursor-pointer"
                      >
                        Cancel
                      </button>
                      <button
                        type="button"
                        onClick={handleCreateTask}
                        disabled={!newTaskTitle.trim()}
                        className="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold rounded-xl shadow-md cursor-pointer transition-all active:scale-95 disabled:opacity-50 flex items-center gap-1.5"
                      >
                        <span>Save & Create in ERPNext</span>
                        <span>⚡</span>
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          ))}

          {/* ========================================================================= */}
          {/* MODAL 3: ERP EMPLOYEE DIRECTORY & STAFF MANAGER (40 STAFF)                */}
          {/* ========================================================================= */}
          {isEmployeeModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-3xl max-w-3xl w-full p-6 sm:p-7 shadow-2xl space-y-5 animate-fade-in max-h-[90vh] overflow-y-auto custom-scrollbar">
                
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center font-bold text-xl">
                      👥
                    </div>
                    <div>
                      <h3 className="text-base font-black text-slate-900">ERP Employee Directory ({employees.length} Total Staff)</h3>
                      <p className="text-[11px] text-slate-500 font-medium">Official Anantdv ERP Employee Master • Connected to Project Owners & Task Assignees</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setIsEmployeeModalOpen(false)}
                    className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 cursor-pointer text-base"
                  >
                    ✕
                  </button>
                </div>

                {/* SEARCH & STATUS FILTER TOOLBAR */}
                <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 text-xs">
                  <div className="relative flex-1">
                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">🔍</span>
                    <input
                      type="text"
                      placeholder="Search employees by name, ID, designation, department, email..."
                      value={empSearchTerm}
                      onChange={(e) => setEmpSearchTerm(e.target.value)}
                      className="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none"
                    />
                  </div>

                  <div className="flex items-center gap-2">
                    <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 shrink-0">
                      <button
                        onClick={() => setEmpStatusFilter('Active')}
                        className={`px-3 py-1.5 rounded-lg font-bold transition-all cursor-pointer ${
                          empStatusFilter === 'Active' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        🟢 Active ({employees.filter(e => e.status === 'Active').length})
                      </button>
                      <button
                        onClick={() => setEmpStatusFilter('Left')}
                        className={`px-3 py-1.5 rounded-lg font-bold transition-all cursor-pointer ${
                          empStatusFilter === 'Left' ? 'bg-white text-slate-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        ⚪ Left ({employees.filter(e => e.status === 'Left').length})
                      </button>
                      <button
                        onClick={() => setEmpStatusFilter('All')}
                        className={`px-3 py-1.5 rounded-lg font-bold transition-all cursor-pointer ${
                          empStatusFilter === 'All' ? 'bg-white text-purple-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        All ({employees.length})
                      </button>
                    </div>
                  </div>
                </div>

                {/* ADD NEW EMPLOYEE FORM */}
                <form onSubmit={handleAddNewEmployee} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3 text-xs">
                  <div className="font-bold text-slate-800 flex items-center gap-1.5">
                    <span>➕</span>
                    <span>Add New Employee to Master Directory</span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    <input
                      required
                      placeholder="Full Name (e.g. Rahul Sen)"
                      value={newEmpName}
                      onChange={(e) => setNewEmpName(e.target.value)}
                      className="px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none"
                    />
                    <input
                      placeholder="Designation (e.g. Lead React Engineer)"
                      value={newEmpRole}
                      onChange={(e) => setNewEmpRole(e.target.value)}
                      className="px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none"
                    />
                    <input
                      placeholder="Mobile No. (e.g. 9830012345)"
                      value={newEmpMobile}
                      onChange={(e) => setNewEmpMobile(e.target.value)}
                      className="px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none font-mono"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    <select
                      value={newEmpDept}
                      onChange={(e) => setNewEmpDept(e.target.value)}
                      className="px-3 py-2 bg-white border border-slate-200 rounded-xl font-medium focus:ring-2 focus:ring-purple-500 focus:outline-none"
                    >
                      <option value="Engineering">Engineering</option>
                      <option value="Development">Development</option>
                      <option value="Design & UI">Design & UI</option>
                      <option value="Quality Assurance">Quality Assurance</option>
                      <option value="Implementation">Implementation</option>
                      <option value="Technology">Technology</option>
                      <option value="Delivery">Delivery</option>
                      <option value="Operations">Operations</option>
                      <option value="Executive">Executive</option>
                      <option value="Infrastructure">Infrastructure</option>
                    </select>

                    <input
                      placeholder="Company Email (e.g. rahul.s@anantdv.com)"
                      value={newEmpEmail}
                      onChange={(e) => setNewEmpEmail(e.target.value)}
                      className="px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none"
                    />

                    <button
                      type="submit"
                      className="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-xs cursor-pointer flex items-center justify-center gap-1"
                    >
                      <span>Add Staff Member</span>
                      <span>✓</span>
                    </button>
                  </div>
                </form>

                {/* EMPLOYEE GRID LIST */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-80 overflow-y-auto custom-scrollbar pr-1">
                  {filteredEmployees.map((emp) => (
                    <div
                      key={emp.id}
                      className="p-3 bg-white border border-slate-200 rounded-2xl flex items-center justify-between gap-3 shadow-2xs hover:border-purple-300 transition-all text-xs"
                    >
                      <div className="flex items-center gap-3 truncate">
                        <span className={`w-9 h-9 rounded-xl text-[11px] font-black text-white flex items-center justify-center shrink-0 shadow-xs ${
                          emp.status === 'Active' ? 'bg-slate-900' : 'bg-slate-400'
                        }`}>
                          {emp.avatar}
                        </span>
                        <div className="truncate">
                          <div className="flex items-center gap-1.5">
                            <h4 className="font-extrabold text-slate-900 truncate">{emp.name}</h4>
                            <span className={`px-1.5 py-0.2 rounded text-[9px] font-bold ${
                              emp.status === 'Active' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'
                            }`}>
                              {emp.status}
                            </span>
                          </div>
                          <p className="text-[10px] text-slate-500 truncate">{emp.role} • <strong className="text-purple-700">{emp.dept}</strong></p>
                          <p className="text-[9px] text-slate-400 font-mono truncate">{emp.email || emp.mobile || 'Anantdv Enterprise'}</p>
                        </div>
                      </div>

                      <span className="font-mono text-[10px] font-bold px-2 py-0.5 rounded bg-slate-50 text-slate-700 border shrink-0">
                        {emp.id}
                      </span>
                    </div>
                  ))}
                </div>

                <div className="flex justify-end pt-3 border-t border-slate-100">
                  <button 
                    type="button" 
                    onClick={() => setIsEmployeeModalOpen(false)} 
                    className="px-5 py-2 bg-slate-900 text-white text-xs font-bold rounded-xl cursor-pointer hover:bg-slate-800"
                  >
                    Close Directory
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL 4: ADD NEW PROJECT MODAL (FULL ERPNEXT DOCTYPE FIELDS & CHILD TABLES) */}
          {/* ========================================================================= */}
          <CreateProjectModal
            isOpen={isNewProjectModalOpen}
            onClose={() => setIsNewProjectModalOpen(false)}
            projects={projects}
            setProjects={setProjects}
            employees={employees}
            showToast={showToast}
            setSelectedProjectForDetailsModal={setSelectedProjectForDetailsModal}
            fetchLiveData={fetchLiveData}
          />

          {/* ============================================================ */}
          {/* MODAL 5: ERPNEXT SERVER CONFIGURATION MODAL                  */}
          {/* ============================================================ */}
          {isConfigModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 animate-fade-in">
                
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">⚙️</span>
                    <div>
                      <h3 className="text-base font-bold text-slate-900">ERPNext Server Config</h3>
                      <p className="text-[11px] text-slate-400">Connected to 192.168.101.175</p>
                    </div>
                  </div>
                  <button onClick={() => setIsConfigModalOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  setConfig({
                    ...config,
                    serverUrl: e.target.serverUrl.value,
                    apiKey: e.target.apiKey.value,
                    apiSecret: e.target.apiSecret.value,
                    token: `${e.target.apiKey.value}:${e.target.apiSecret.value}`,
                    enableLiveApi: e.target.enableLiveApi.checked
                  });
                  setIsConfigModalOpen(false);
                  fetchLiveData();
                  showToast('ERPNext Server configuration updated!');
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Server URL</label>
                    <input name="serverUrl" defaultValue={config.serverUrl} placeholder="http://192.168.101.175" className="w-full px-3 py-2 border rounded-xl bg-slate-50 font-mono" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">API Key</label>
                      <input name="apiKey" defaultValue={config.apiKey} placeholder="ccea7f132f74703" className="w-full px-3 py-2 border rounded-xl bg-slate-50 font-mono" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">API Secret</label>
                      <input name="apiSecret" defaultValue={config.apiSecret} placeholder="73677ab6bce0827" className="w-full px-3 py-2 border rounded-xl bg-slate-50 font-mono" />
                    </div>
                  </div>

                  <div className="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="enableLiveApi" name="enableLiveApi" defaultChecked={config.enableLiveApi} className="rounded" />
                    <label htmlFor="enableLiveApi" className="font-semibold text-slate-700">Enable Live REST API Sync</label>
                  </div>

                  <div className="p-3 bg-emerald-50 rounded-xl text-[11px] text-emerald-900 border border-emerald-200 space-y-1">
                    <div>🟢 <strong>Status:</strong> Live connection active & verified to ERPNext!</div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onClick={() => setIsConfigModalOpen(false)} className="px-4 py-2 border rounded-xl font-bold">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white font-bold rounded-xl shadow-md">Save & Sync</button>
                  </div>
                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  
  </script>
</body>
</html>

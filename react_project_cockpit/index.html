<body class="bg-[#f8fafc] text-slate-900 min-h-screen antialiased">

    const PRIORITY_STYLES = {

    function generateProjectTasks(projName, pNum) {
      const isFullyDoneProj = pNum % 4 === 1;
      const isNotStartedProj = pNum % 4 === 0;

      return [
        { id: `TASK-2026-0001`, name: "Database Schema & Multi-tenant Architecture Setup", category: "Development", assignee: "Niranjan Singh", dueDate: "2026-07-25", priority: "Urgent", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },
        { id: `TASK-2026-0002`, name: "Supplier & Multi-warehouse Inventory Logic", category: "Development", assignee: "Niranjan Singh", dueDate: "2026-08-10", priority: "Medium", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },
        { id: `TASK-2026-0003`, name: "REST API Gateway & OAuth2 Token Authentication", category: "Development", assignee: "Dipanwita", dueDate: "2026-08-25", priority: "High", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Working" },
        { id: `TASK-2026-0004`, name: "Payment Gateway Webhook & Transaction Reconciliation", category: "Development", assignee: "Dipanwita", dueDate: "2026-08-30", priority: "Urgent", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Working" },
        { id: `TASK-2026-0005`, name: "Frappe Background Queue & Redis Cache Optimization", category: "Development", assignee: "Niranjan Singh", dueDate: "2026-09-02", priority: "Medium", status: isFullyDoneProj ? "Completed" : "Open" },
        { id: `TASK-2026-0006`, name: "Automated PDF Invoice & GST Tax Calculation Engine", category: "Development", assignee: "Dipanwita", dueDate: "2026-08-14", priority: "Medium", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },
        { id: `TASK-2026-0007`, name: "Real-time Webhook Dispatcher for Third-Party Logins", category: "Development", assignee: "Dipanwita", dueDate: "2026-09-10", priority: "High", status: isFullyDoneProj ? "Completed" : "Open" },

        { id: `TASK-2026-0008`, name: "Executive Analytics Dashboard & KPI Cards UI", category: "UI", assignee: "Tanuja", dueDate: "2026-08-05", priority: "High", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },
        { id: `TASK-2026-0009`, name: "Responsive Mobile Navigation & Drawer Interface", category: "UI", assignee: "Tanuja", dueDate: "2026-08-28", priority: "Medium", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Working" },
        { id: `TASK-2026-0010`, name: "B2B Customer Self-Service Order Portal UI", category: "UI", assignee: "Sushmita", dueDate: "2026-09-01", priority: "Urgent", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Working" },
        { id: `TASK-2026-0011`, name: "Modern Design System & Form Validation Components", category: "UI", assignee: "Tanuja", dueDate: "2026-08-12", priority: "Medium", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },
        { id: `TASK-2026-0012`, name: "Clean White Theme Light-Mode Contrast Enhancement", category: "UI", assignee: "Sushmita", dueDate: "2026-08-18", priority: "High", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },

        { id: `TASK-2026-0013`, name: "Legacy MySQL Inventory Schema Data Migration", category: "Migration", assignee: "Niranjan Singh", dueDate: "2026-08-05", priority: "High", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },
        { id: `TASK-2026-0014`, name: "Customer Account History & Outstanding Ledger Import", category: "Migration", assignee: "Dipanwita", dueDate: "2026-08-16", priority: "Medium", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },
        { id: `TASK-2026-0015`, name: "Product Catalog Images & Media CDN Migration", category: "Migration", assignee: "Tanuja", dueDate: "2026-08-29", priority: "Urgent", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Working" },
        { id: `TASK-2026-0016`, name: "Employee Master & Payroll Salary Structure Import", category: "Migration", assignee: "Niranjan Singh", dueDate: "2026-08-20", priority: "High", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },

        { id: `TASK-2026-0017`, name: "End-to-end Stress QA & API Load Testing", category: "Testing", assignee: "Tanuja", dueDate: "2026-09-03", priority: "High", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Working" },
        { id: `TASK-2026-0018`, name: "Cross-browser Safari & Chrome Regression Suite", category: "Testing", assignee: "Sushmita", dueDate: "2026-08-22", priority: "Medium", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },
        { id: `TASK-2026-0019`, name: "OWASP Security Vulnerability Scan & Penetration Test", category: "Testing", assignee: "Sushmita", dueDate: "2026-09-15", priority: "Urgent", status: isFullyDoneProj ? "Completed" : "Open" },

        { id: `TASK-2026-0020`, name: "REST API Swagger & OpenAPI Specification Docs", category: "Documentation", assignee: "Dipanwita", dueDate: "2026-08-15", priority: "High", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },
        { id: `TASK-2026-0021`, name: "Administrator Deployment & Bench Setup Handbook", category: "Documentation", assignee: "Niranjan Singh", dueDate: "2026-08-25", priority: "Medium", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Completed" },
        { id: `TASK-2026-0022`, name: "End-User Onboarding Interactive Guide & Video Tour", category: "Documentation", assignee: "Tanuja", dueDate: "2026-09-10", priority: "Low", status: isFullyDoneProj ? "Completed" : isNotStartedProj ? "Open" : "Working" }
      ];
    }

    const PROJECT_NAMES = [
      "ADV-Nirolite ERP Core Modernization",
      "ADV-VMS Visitor Management & QR Check-in",
      "AI Document OCR & Invoice Parser Suite",
      "ADV-IMEL Smart Factory Telemetry Hub",
      "Carpenter Water Fiji ERP Cloud Instance",
      "Supplier Portal & Solomon Point of Purchase",
      "Global Multi-Region Cloud Infrastructure Migration",
      "Omnichannel Mobile POS & Loyalty App",
      "Automated Payroll & Tax Compliance Engine",
      "Enterprise Customer 360 & CRM Integration",
      "Automated Warehouse AGV Robotics Dispatch",
      "Healthcare HIPAA Compliance & Audit Vault",
      "Global B2B E-Commerce Marketplace",
      "Predictive Machine Maintenance AI Model",
      "Enterprise Single Sign-On & SAML 2.0 Identity Hub",
      "Interactive Supply Chain Live Map & Geofencing",
      "Automated Cold-Storage Temperature Monitoring",
      "AI Customer Support Voicebot & Agent Assist",
      "Enterprise Digital Asset Management (DAM) 2.0",
      "Zero-Trust Network Perimeter & Micro-Segmentation",
      "Solar Energy Microgrid Telemetry & Dispatch",
      "Automated Fleet Maintenance & Fuel Tracking",
      "Self-Service Employee HR & Benefits Portal",
      "Real-Time Fraud Detection & Risk Scoring Engine",
      "Automated Hotel Revenue & Dynamic Pricing Engine",
      "Pharmaceutical Serialization & Track-and-Trace",
      "Smart Agriculture Drone NDVI Crop Health Suite",
      "Automated Airport Baggage Sorting & RFID Flow",
      "Legal Contract AI Redlining & Risk Analyzer",
      "EV Charging Station OCPI Network Roaming Hub",
      "Automated Insurance Claims Video Damage Estimator",
      "Smart Water Utility Leakage Acoustic Sensor Grid",
      "Campus Dining Micro-Payment & Meal Plan NFC",
      "Biometric Border Control E-Passport Gateways",
      "Real-Time Crypto Settlement & Custody Gateway",
      "Construction Jobsite 3D BIM Clash Detection",
      "AI Radiologist X-Ray Pneumonia Triage Tool",
      "Autonomous Drone Delivery Fleet Dispatcher",
      "Enterprise Energy Carbon Footprint ESG Ledger",
      "Intelligent Smart-City Traffic Light Synchronization"
    ];

    const INITIAL_PROJECTS = PROJECT_NAMES.map((name, idx) => {
      const pNum = idx + 1;
      const id = `PROJ-${String(pNum).padStart(4, '0')}`;
      const tasks = generateProjectTasks(name, pNum);
      const completed = tasks.filter(t => t.status === "Completed").length;
      const pct = Math.round((completed / tasks.length) * 100);

      const status = pct === 100 ? "Completed" : pct > 0 ? "Working" : "Not Started";

      return {
        id,
        name,
        company: "Anantdv Enterprise",
        status: status,
        priority: idx % 4 === 0 ? "Urgent" : idx % 3 === 0 ? "High" : idx % 2 === 0 ? "Medium" : "Low",
        owner: "Niranjan Singh",
        startDate: "2026-07-01",
        dueDate: "2026-09-15",
        assignedTeamCount: 4,
        percentCompleted: pct,
        assignedUsers: [
          { name: "Niranjan Singh", avatar: "NS" },
          { name: "Dipanwita", avatar: "DP" },
          { name: "Tanuja", avatar: "TD" },
          { name: "Sushmita", avatar: "SB" }
        ],
        tasks
      };
    });

    function App() {
      const [config, setConfig] = useState(() => {
        const saved = localStorage.getItem('erp_server_config_live');
        return saved ? JSON.parse(saved) : DEFAULT_CONFIG;
      });

      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);

      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem('erpnext_projects_40_dnd_v15');
        return saved ? JSON.parse(saved) : INITIAL_PROJECTS;
      });

      // Navigation: 'projects_list' | 'project_details'
      const [currentPage, setCurrentPage] = useState('projects_list');
      // Project View Mode: 'kanban' | 'grid'
      const [projectViewMode, setProjectViewMode] = useState('kanban');

      const [selectedProjectId, setSelectedProjectId] = useState('PROJ-0001');
      const [visibleCount, setVisibleCount] = useState(10);
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      
      // Task View Mode: 'kanban' | 'grid'
      const [taskLayoutMode, setTaskLayoutMode] = useState('kanban');
      const [taskPriorityFilter, setTaskPriorityFilter] = useState('All');
      const [taskCategoryFilter, setTaskCategoryFilter] = useState('All');
      const [taskSearchTerm, setTaskSearchTerm] = useState('');

      // Drag and Drop active column state
      const [dragOverColumn, setDragOverColumn] = useState(null);

      const [collapsedCategories, setCollapsedCategories] = useState({});
      const [notification, setNotification] = useState(null);

      // Add Modals
      const [isNewProjectModalOpen, setIsNewProjectModalOpen] = useState(false);
      const [isNewTaskModalOpen, setIsNewTaskModalOpen] = useState(false);
      const [targetProjectForNewTask, setTargetProjectForNewTask] = useState('PROJ-0001');

      useEffect(() => {
        localStorage.setItem('erpnext_projects_40_dnd_v15', JSON.stringify(projects));
      }, [projects]);

      const showToast = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3500);
      };

      const handleOpenProject = (id) => {
        setSelectedProjectId(id);
        setCurrentPage('project_details');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleCreateProject = (newProjData) => {
        const newId = `PROJ-${String(projects.length + 1).padStart(4, '0')}`;
        const newProject = {
          id: newId,
          name: newProjData.name,
          company: newProjData.company || "Anantdv Enterprise",
          status: newProjData.status || "Not Started",
          priority: newProjData.priority || "Medium",
          owner: newProjData.owner || "Niranjan Singh",
          startDate: newProjData.startDate || new Date().toISOString().split('T')[0],
          dueDate: newProjData.dueDate || "2026-10-30",
          assignedTeamCount: 2,
          percentCompleted: 0,
          assignedUsers: [
            { name: newProjData.owner || "Niranjan Singh", avatar: (newProjData.owner || "NS").slice(0, 2).toUpperCase() }
          ],
          tasks: []
        };

        setProjects([newProject, ...projects]);
        setIsNewProjectModalOpen(false);
        showToast(`🎉 Project ${newId} created successfully!`);
      };

      const handleCreateTask = (newTaskData) => {
        const pId = newTaskData.projectId || selectedProjectId;
        const newTask = {
          id: `TASK-2026-${String(Math.floor(1000 + Math.random() * 9000))}`,
          name: newTaskData.name,
          category: newTaskData.category || "Development",
          assignee: newTaskData.assignee || "Niranjan Singh",
          dueDate: newTaskData.dueDate || new Date().toISOString().split('T')[0],
          priority: newTaskData.priority || "Medium",
          status: newTaskData.status || "Open"
        };

        setProjects(prev => {
          return prev.map(p => {
            if (p.id !== pId) return p;
            const updated = [...p.tasks, newTask];
            const comp = updated.filter(t => t.status === 'Completed').length;
            const pct = Math.round((comp / updated.length) * 100);
            return {
              ...p,
              percentCompleted: pct,
              status: pct === 100 ? 'Completed' : pct > 0 ? 'Working' : 'Not Started',
              tasks: updated
            };
          });
        });

        setIsNewTaskModalOpen(false);
        showToast(`⚡ Task ${newTask.id} added to ${pId}!`);
      };

      // Direct task status transition (automatically moves task to corresponding column)
      const handleTaskStatusChange = (projectId, taskId, newStatus) => {
        setProjects(prev => {
          return prev.map(p => {
            if (p.id !== projectId) return p;
            const updated = p.tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t);
            const comp = updated.filter(t => t.status === 'Completed').length;
            const pct = Math.round((comp / updated.length) * 100);
            return {
              ...p,
              percentCompleted: pct,
              status: pct === 100 ? 'Completed' : pct > 0 ? 'Working' : 'Not Started',
              tasks: updated
            };
          });
        });
        showToast(`✓ Task ${taskId} automatically moved to "${newStatus}"!`);
      };

      const handleMoveProjectStatus = (projectId, newStatus) => {
        setProjects(prev => {
          return prev.map(p => {
            if (p.id !== projectId) return p;
            let newPct = p.percentCompleted;
            if (newStatus === 'Completed') newPct = 100;
            else if (newStatus === 'Not Started') newPct = 0;
            else if (newStatus === 'Working' && (newPct === 0 || newPct === 100)) newPct = 50;

            return {
              ...p,
              status: newStatus,
              percentCompleted: newPct
            };
          });
        });
        showToast(`Moved ${projectId} to "${newStatus}"!`);
      };

      // HTML5 Drag and Drop handlers for Tasks
      const handleDragStartTask = (e, taskId) => {
        e.dataTransfer.setData('text/plain', taskId);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOverColumn = (e, colName) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (dragOverColumn !== colName) {
          setDragOverColumn(colName);
        }
      };

      const handleDragLeaveColumn = (e) => {
        setDragOverColumn(null);
      };

      const handleDropTask = (e, targetStatus) => {
        e.preventDefault();
        setDragOverColumn(null);
        const taskId = e.dataTransfer.getData('text/plain');
        if (taskId) {
          handleTaskStatusChange(selectedProjectId, taskId, targetStatus);
        }
      };

      // Projects Filter
      const filteredProjects = useMemo(() => {
        return projects.filter(p => {
          const matchSearch = !searchTerm || p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.id.toLowerCase().includes(searchTerm.toLowerCase());
          const isComp = p.status === 'Completed' || p.percentCompleted === 100;
          const isWork = (p.status === 'Working' || p.status === 'In Progress') && p.percentCompleted > 0 && p.percentCompleted < 100;
          const isNotOpen = p.status === 'Not Started' || p.percentCompleted === 0;

          let matchStatus = true;
          if (statusFilter === 'Completed') matchStatus = isComp;
          else if (statusFilter === 'Working' || statusFilter === 'In Progress') matchStatus = isWork;
          else if (statusFilter === 'Not Started' || statusFilter === 'Open') matchStatus = isNotOpen;

          return matchSearch && matchStatus;
        });
      }, [projects, searchTerm, statusFilter]);

      const kanbanColumns = useMemo(() => {
        const completed = filteredProjects.filter(p => p.status === 'Completed' || p.percentCompleted === 100);
        const working = filteredProjects.filter(p => (p.status === 'Working' || p.status === 'In Progress') && p.percentCompleted > 0 && p.percentCompleted < 100);
        const notOpen = filteredProjects.filter(p => p.status === 'Not Started' || p.percentCompleted === 0);

        return { completed, working, notOpen };
      }, [filteredProjects]);

      const visibleProjects = useMemo(() => {
        return filteredProjects.slice(0, visibleCount);
      }, [filteredProjects, visibleCount]);

      const currentProj = useMemo(() => {
        return projects.find(p => p.id === selectedProjectId) || projects[0];
      }, [projects, selectedProjectId]);

      const allTasks = currentProj?.tasks || [];

      // Filtered Tasks inside Project Details
      const filteredTasks = useMemo(() => {
        return allTasks.filter(task => {
          const matchSearch = !taskSearchTerm || task.name.toLowerCase().includes(taskSearchTerm.toLowerCase()) || task.id.toLowerCase().includes(taskSearchTerm.toLowerCase()) || task.assignee.toLowerCase().includes(taskSearchTerm.toLowerCase());
          const matchPriority = taskPriorityFilter === 'All' || task.priority === taskPriorityFilter;
          const matchCategory = taskCategoryFilter === 'All' || task.category === taskCategoryFilter;
          return matchSearch && matchPriority && matchCategory;
        });
      }, [allTasks, taskSearchTerm, taskPriorityFilter, taskCategoryFilter]);

      const taskKanbanColumns = useMemo(() => {
        const completed = filteredTasks.filter(t => t.status === 'Completed');
        const working = filteredTasks.filter(t => t.status === 'Working' || t.status === 'In Progress');
        const open = filteredTasks.filter(t => t.status !== 'Completed' && t.status !== 'Working' && t.status !== 'In Progress');
        return { completed, working, open };
      }, [filteredTasks]);

      const totalTasksCount = allTasks.length;
      const completedTasksCount = allTasks.filter(t => t.status === 'Completed').length;
      const workingTasksCount = allTasks.filter(t => t.status === 'Working' || t.status === 'In Progress').length;
      const openTasksCount = totalTasksCount - completedTasksCount - workingTasksCount;
      const overallPercent = totalTasksCount > 0 ? Math.round((completedTasksCount / totalTasksCount) * 100) : (currentProj?.percentCompleted || 0);

      const isProject100Done = overallPercent === 100 || currentProj?.status === 'Completed';
      const isProjectWorking = overallPercent > 0 && overallPercent < 100;
      const isProjectNotOpen = overallPercent === 0;

      const categoriesList = ["Development", "UI", "Migration", "Testing", "Documentation"];

      const categoryData = useMemo(() => {
        return categoriesList.map(catKey => {
          const catConfig = CATEGORY_CONFIG[catKey];
          const tasksInCat = filteredTasks.filter(t => t.category === catKey);
          const doneCount = tasksInCat.filter(t => t.status === 'Completed').length;
          const totalCount = tasksInCat.length;
          const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

          return {
            key: catKey,
            label: catConfig.label,
            icon: catConfig.icon,
            barColor: catConfig.barColor,
            textColor: catConfig.textColor,
            bgClass: catConfig.bgClass,
            tasks: tasksInCat,
            doneCount,
            totalCount,
            pct
          };
        });
      }, [filteredTasks]);

      const toggleCategory = (catKey) => {
        setCollapsedCategories(prev => ({ ...prev, [catKey]: !prev[catKey] }));
      };

      const expandAll = () => setCollapsedCategories({});
      const collapseAll = () => {
        const all = {};
        categoriesList.forEach(k => { all[k] = true; });
        setCollapsedCategories(all);
      };

      // Draggable Task Card Component
      const renderTaskCard = (task) => {
        const isCompleted = task.status === 'Completed';
        const isWorking = task.status === 'Working' || task.status === 'In Progress';
        const isOpen = !isCompleted && !isWorking;
        const isUrgent = task.priority === 'Urgent';

        const cardBg = isCompleted
          ? 'bg-emerald-50/70 border-emerald-300 ring-1 ring-emerald-400/20'

                    owner: e.target.owner.value,
                    startDate: e.target.startDate.value,
                    dueDate: e.target.dueDate.value,
                    status: e.target.status.value
                  });
                }} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5">Project Title / Name *</label>
                    <input 
                      required 
                      name="name" 
                      placeholder="e.g. ADV-Global Cloud Suite Modernization" 
                      className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3.5">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5">Customer / Company</label>
                      <input 
                        name="company" 
                        defaultValue="Anantdv Enterprise" 
                        className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5">Priority</label>
                      <select 
                        name="priority" 
                        defaultValue="High"
                        className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold"
                      >
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">🔥 Urgent</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3.5">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5">Project Lead / Owner</label>
                      <input 
                        name="owner" 
                        defaultValue="Niranjan Singh" 
                        className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5">Initial Status</label>
                      <select 
                        name="status" 
                        defaultValue="Working"
                        className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold"
                      >
                        <option value="Completed">🟢 Completed (100% Green)</option>
                        <option value="Working">🟡 Working (Yellow)</option>
                        <option value="Not Started">🔴 Open / Not Started (Light Red)</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3.5">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5">Start Date</label>
                      <input 
                        name="startDate" 
                        type="date" 
                        defaultValue={new Date().toISOString().split('T')[0]} 
                        className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono" 
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5">Due Date *</label>
                      <input 
                        required 
                        name="dueDate" 
                        type="date" 
                        defaultValue="2026-10-30" 
                        className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono" 
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2.5 pt-4 border-t border-slate-100">
                    <button 
                      type="button" 
                      onClick={() => setIsNewProjectModalOpen(false)} 
                      className="px-4 py-2.5 border border-slate-200 hover:bg-slate-100 rounded-xl font-bold cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md cursor-pointer"
                    >
                      Create Project
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* ============================================================ */}
          {/* MODAL 2: ADD NEW TASK MODAL                                  */}
          {/* ============================================================ */}
          {isNewTaskModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-3xl max-w-lg w-full p-6 sm:p-7 shadow-2xl space-y-5 animate-fade-in">
                
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2.5">
                    <div className="w-9 h-9 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center font-bold text-lg">
                      ⚡
                    </div>
                    <div>
                      <h3 className="text-base font-black text-slate-900">Add New Task</h3>
                      <p className="text-[11px] text-slate-400">Create a task linked to category with priority and assignee</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setIsNewTaskModalOpen(false)}
                    className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 cursor-pointer text-base"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  handleCreateTask({
                    projectId: e.target.projectId.value,
                    name: e.target.name.value,
                    category: e.target.category.value,
                    priority: e.target.priority.value,
                    status: e.target.status.value,
                    assignee: e.target.assignee.value,
                    dueDate: e.target.dueDate.value
                  });
                }} className="space-y-4 text-xs">
                  
                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5">Target Project *</label>
                    <select 
                      name="projectId" 
                      defaultValue={targetProjectForNewTask} 
                      className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-bold text-blue-600"
                    >
                      {projects.map(p => (
                        <option key={p.id} value={p.id}>{p.id} — {p.name}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5">Task Title / Subject *</label>
                    <input 
                      required 
                      name="name" 
                      placeholder="e.g. Implement OAuth2 Refresh Token Service" 
                      className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3.5">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5">Work Category *</label>
                      <select 
                        name="category" 
                        defaultValue="Development"
                        className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold"
                      >
                        <option value="Development">💻 Development</option>
                        <option value="UI">🎨 UI</option>
                        <option value="Migration">🔄 Migration</option>
                        <option value="Testing">🧪 Testing</option>
                        <option value="Documentation">📄 Documentation</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5">Priority</label>
                      <select 
                        name="priority" 
                        defaultValue="Urgent"
                        className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold"
                      >
                        <option value="Urgent">🔥 Urgent Priority</option>
                        <option value="High">▲ High Priority</option>
                        <option value="Medium">● Medium Priority</option>
                        <option value="Low">▽ Low Priority</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3.5">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5">Initial Status</label>
                      <select 
                        name="status" 
                        defaultValue="Open"
                        className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold"
                      >
                        <option value="Open">🔴 Open (Light Red)</option>
                        <option value="Working">🟡 Working (Yellow)</option>
                        <option value="Completed">🟢 Completed (Green)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5">Assignee</label>
                      <input 
                        name="assignee" 
                        defaultValue="Niranjan Singh" 
                        placeholder="e.g. Niranjan Singh" 
                        className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5">Due Date *</label>
                    <input 
                      required 
                      name="dueDate" 
                      type="date" 
                      defaultValue={new Date().toISOString().split('T')[0]} 
                      className="w-full px-3.5 py-2.5 border rounded-xl bg-slate-50 border-slate-200 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono" 
                    />
                  </div>

                  <div className="flex justify-end gap-2.5 pt-4 border-t border-slate-100">
                    <button 
                      type="button" 
                      onClick={() => setIsNewTaskModalOpen(false)} 
                      className="px-4 py-2.5 border border-slate-200 hover:bg-slate-100 rounded-xl font-bold cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md cursor-pointer"
                    >
                      Create Task
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* ============================================================ */}
          {/* MODAL 3: ERPNEXT SERVER CONFIGURATION MODAL                  */}
          {/* ============================================================ */}
          {isConfigModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 animate-fade-in">
                
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">⚙️</span>
                    <div>
                      <h3 className="text-base font-bold text-slate-900">ERPNext Server Config</h3>
                      <p className="text-[11px] text-slate-400">Configure connection to your ERPNext instance</p>
                    </div>
                  </div>
                  <button onClick={() => setIsConfigModalOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  setConfig({
                    ...config,
                    serverUrl: e.target.serverUrl.value,
                    token: e.target.token.value,
                    enableLiveApi: e.target.enableLiveApi.checked
                  });
                  setIsConfigModalOpen(false);
                  showToast('ERPNext Server configuration updated!');
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Server URL</label>
                    <input name="serverUrl" defaultValue={config.serverUrl} placeholder="http://192.168.101.175" className="w-full px-3 py-2 border rounded-xl bg-slate-50 font-mono" />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">API Token (apiKey:apiSecret)</label>
                    <input name="token" defaultValue={config.token} placeholder="56d7e5504ef6796:9d6e53480ab4aa9" className="w-full px-3 py-2 border rounded-xl bg-slate-50 font-mono" />
                  </div>

                  <div className="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="enableLiveApi" name="enableLiveApi" defaultChecked={config.enableLiveApi} className="rounded" />
                    <label htmlFor="enableLiveApi" className="font-semibold text-slate-700">Enable Live REST API Sync</label>
                  </div>

                  <div className="p-3 bg-slate-50 rounded-xl text-[11px] text-slate-500 space-y-1">
                    <div>💡 <strong>Config File:</strong> You can also edit <code className="font-mono text-blue-600">config.js</code> directly.</div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onClick={() => setIsConfigModalOpen(false)} className="px-4 py-2 border rounded-xl font-bold">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white font-bold rounded-xl shadow-md">Save Configuration</button>
                  </div>
                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

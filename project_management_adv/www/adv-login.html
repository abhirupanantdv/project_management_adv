<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "Login - Advanced Project Cockpit" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at 15% 15%, #0f172a 0%, #090d16 50%, #030712 100%);
      min-height: 100vh;
      color: #f8fafc;
    }
    .glow-portal {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(99, 102, 241, 0.1) 40%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(56, 189, 248, 0.08);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Ambient Ambient Glow Orbs -->
  <div class="glow-portal -top-24 -left-24"></div>
  <div class="glow-portal -bottom-24 -right-24" style="background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(59, 130, 246, 0.1) 40%, transparent 70%);"></div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- Branding Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-slate-900/80 border border-slate-700/60 shadow-xl mb-4">
        <img 
          src="/assets/adv_project/images/anantdv_logo_dark.png" 
          alt="Anantdv Logo" 
          class="h-10 w-auto object-contain"
          onerror="this.onerror=null; this.src='/assets/adv_project/images/anantdv_logo.png';"
        />
      </div>
      <h1 class="text-2xl font-black font-display tracking-tight text-white">
        Project Cockpit
      </h1>
      <p class="text-xs text-slate-400 mt-1 font-medium">
        Sign in to access live ERPNext projects and tasks
      </p>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-2xl p-7 sm:p-8">
      
      <!-- Error / Alert Banner -->
      <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs font-semibold flex items-start gap-2.5">
        <svg class="w-4 h-4 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke-width="2"/>
          <line x1="12" y1="8" x2="12" y2="12" stroke-width="2"/>
          <line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2"/>
        </svg>
        <span id="alertMsg">Invalid credentials. Please try again.</span>
      </div>

      <!-- Success Banner -->
      <div id="successBox" class="hidden mb-5 p-3.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-semibold flex items-center gap-2.5">
        <svg class="w-4 h-4 text-emerald-400 shrink-0 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span>Authentication verified! Redirecting...</span>
      </div>

      <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
        <input type="hidden" id="redirectInput" value="{{ redirect_to or '/adv-project' }}" />

        <!-- Username / Email -->
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">
            Email or Username
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
              </svg>
            </div>
            <input 
              type="text" 
              id="username" 
              required 
              placeholder="e.g. administrator or user@example.com"
              class="w-full pl-10 pr-3.5 py-3 rounded-xl bg-slate-900/60 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all font-medium"
            />
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">
              Password
            </label>
            <a href="/update-password" class="text-xs text-sky-400 hover:text-sky-300 font-semibold transition-colors">
              Forgot?
            </a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4" stroke-width="2"/>
              </svg>
            </div>
            <input 
              type="password" 
              id="password" 
              required 
              placeholder="????????????"
              class="w-full pl-10 pr-10 py-3 rounded-xl bg-slate-900/60 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all font-medium"
            />
            <button 
              type="button" 
              onclick="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white"
            >
              <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-sky-500 via-indigo-600 to-purple-600 hover:from-sky-400 hover:via-indigo-500 hover:to-purple-500 text-white font-bold text-sm shadow-lg shadow-sky-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span id="btnText">Sign In to Cockpit</span>
          <svg id="btnSpinner" class="hidden w-4 h-4 animate-spin text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </button>

      </form>

      <!-- Footer Info -->
      <div class="mt-6 pt-5 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
        <span>ERPNext Shared Session</span>
        <a href="/login" class="text-sky-400 hover:text-sky-300 font-semibold hover:underline">
          Standard Desk Login &rarr;
        </a>
      </div>

    </div>

    <!-- Security Footnote -->
    <p class="text-center text-xs text-slate-500 mt-6">
      Protected with end-to-end Frappe session encryption
    </p>

  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      if (pwd.type === 'password') {
        pwd.type = 'text';
      } else {
        pwd.type = 'password';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const redirectUrl = document.getElementById('redirectInput').value || '/adv-project';

      const alertBox = document.getElementById('alertBox');
      const alertMsg = document.getElementById('alertMsg');
      const successBox = document.getElementById('successBox');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      alertBox.classList.add('hidden');
      successBox.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.innerText = 'Verifying Session...';
      btnSpinner.classList.remove('hidden');

      try {
        // Native Frappe login endpoint - sets ERPNext session cookie automatically!
        const response = await fetch('/api/method/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            usr: username,
            pwd: password,
            device: 'desktop'
          })
        });

        const data = await response.json();

        if (response.ok && (data.message === 'Logged In' || data.home_page)) {
          successBox.classList.remove('hidden');
          btnText.innerText = 'Redirecting...';
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 600);
        } else {
          throw new Error(data.message || 'Invalid username or password.');
        }
      } catch (err) {
        alertMsg.innerText = err.message || 'Login failed. Please check credentials.';
        alertBox.classList.remove('hidden');
        submitBtn.disabled = false;
        btnText.innerText = 'Sign In to Cockpit';
        btnSpinner.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
